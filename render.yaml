# Free web hosting requires an external persistent PostgreSQL database.
# Create a free Neon project, then enter its connection string in DATABASE_URL.
services:
  - type: web
    name: takolo-plataforma
    runtime: docker
    branch: codex/takolo-multiusuario
    dockerfilePath: ./Dockerfile.personal
    dockerContext: .
    plan: free
    numInstances: 1
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PERSONAL_DATA_DIR
        value: /tmp/takolo
      - key: DATABASE_URL
        sync: false
      - key: TAKOLO_REQUIRE_REMOTE_DB
        value: "1"
      - key: TAKOLO_SESSION_SECRET
        generateValue: true
      - key: TAKOLO_ENCRYPTION_SECRET
        generateValue: true
      - key: PERSONAL_HTTPS
        value: "1"
      - key: PERSONAL_SETUP_TOKEN
        generateValue: true
      - key: WHATSAPP_SEND_ENABLED
        value: "0"
      - key: TAKOLO_REGISTRATION_OPEN
        value: "1"
      - key: TAKOLO_TRUST_PROXY
        value: "1"
      - key: TAKOLO_FREE_HOSTING
        value: "1"
